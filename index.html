<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoX - In-App 3D Workspace</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern CSS Variables & Reset */
        :root {
            --bg-main: #0B0F19;
            --bg-surface: #131B2E;
            --bg-surface-hover: #1E2942;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --brand-primary: #38BDF8;
            --brand-gradient: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
            --accent-success: #34D399;
            --accent-warning: #F59E0B;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: var(--brand-gradient);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--bg-main);
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .project-meta {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--brand-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .btn {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--brand-gradient);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Core Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Left Panel: 3D Toolbar Assets */
        .toolbar {
            width: 280px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 24px;
        }

        .panel-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .tool-card {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-card:hover {
            border-color: var(--brand-primary);
            background-color: var(--bg-surface-hover);
        }

        .tool-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .tool-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Center Canvas: Interactive 3D Mockup */
        .canvas-container {
            flex: 1;
            background-color: var(--bg-main);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Grid Background Pattern to Mimic 3D Viewport */
        .canvas-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Conceptual 3D Model placeholder */
        .mock-3d-model {
            position: relative;
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #6366F1 0%, #4338CA 100%);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 4s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Spatial Annotation Pins */
        .pin {
            position: absolute;
            background-color: var(--brand-primary);
            color: var(--bg-main);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3);
        }

        .pin-1 { top: 20px; left: 40px; }
        .pin-2 { bottom: 40px; right: 30px; }

        /* Camera / Canvas Controls Overlay */
        .canvas-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg-surface);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            gap: 16px;
            border: 1px solid var(--border-color);
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .control-btn:hover {
            color: var(--brand-primary);
        }

        /* Right Panel: Active Component Details & Smart AI Guide Layer */
        .inspector {
            width: 360px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .inspector-section {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-group {
            margin-top: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-field, .textarea-field {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-primary);
            font-family: inherit;
            transition: var(--transition);
        }

        .input-field:focus, .textarea-field:focus {
            outline: none;
            border-color: var(--brand-primary);
        }

        /* AI Guidance System UI Card */
        .ai-guide-card {
            background: linear-gradient(180deg, rgba(129, 140, 248, 0.08) 0%, rgba(56, 189, 248, 0.03) 100%);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 12px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .ai-sparkle {
            font-size: 1.2rem;
        }

        .ai-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #A5B4FC;
        }

        .ai-message {
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .ai-checklist {
